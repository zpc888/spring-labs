server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: z-sb4-rest-logging
    static_configs:
      - targets:
          - localhost
        labels:
          job: z-sb4-rest-logging
          app: rest-logging-in-spring-way
          __path__: /var/log/z-sb4-rest-logging/rest-logging.json
    pipeline_stages:
      - json:
          expressions:
            traceId: traceId
            spanId: spanId
            level: level
            logger_name: logger_name
            service: service
            message: message
